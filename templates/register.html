<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create Account - ChurnIntel AI</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
</head>
<body>

    <div class="auth-container">
        <div class="auth-header">
            <div class="brand-icon" style="margin: 0 auto; width: 48px; height: 48px; font-size: 1.4rem;">
                <i class="fas fa-chart-line"></i>
            </div>
            <h2>ChurnIntel AI</h2>
            <p>Enterprise Customer Retention Platform</p>
        </div>

        <div class="glass-card">
            <h3 style="color: #fff; font-size: 1.15rem; margin-bottom: 18px; font-weight: 600;">
                <i class="fas fa-user-plus" style="color: var(--accent);"></i> Create New Account
            </h3>

            {% if error %}
                <div style="background: var(--danger-bg); border: 1px solid rgba(239, 68, 68, 0.3); color: #fca5a5; padding: 10px 14px; border-radius: 8px; font-size: 0.88rem; margin-bottom: 16px;">
                    <i class="fas fa-triangle-exclamation"></i> {{ error }}
                </div>
            {% endif %}

            <form method="POST" action="/register">
                <div class="form-group" style="margin-bottom: 16px;">
                    <label><i class="fas fa-user"></i> Choose Username</label>
                    <input type="text" name="username" placeholder="Choose a username" required class="form-control" autofocus>
                </div>

                <div class="form-group" style="margin-bottom: 20px;">
                    <label><i class="fas fa-key"></i> Choose Password</label>
                    <input type="password" name="password" placeholder="Create a password" required class="form-control">
                </div>

                <button type="submit" class="btn-predict">
                    <i class="fas fa-user-check"></i> Complete Registration
                </button>
            </form>

            <div class="auth-footer">
                Already registered? <a href="{{ url_for('login') }}">Sign in here</a>
            </div>
        </div>
    </div>

</body>
</html>
